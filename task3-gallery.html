  <h1>Image Gallery</h1>
  <p class="task-intro">Nine images sit in a <code>grid-template-columns: repeat(3, 1fr)</code> container with a fixed <code>grid-auto-rows</code> and a consistent <code>gap</code>. Each caption is absolutely positioned inside its figure and slides up on hover.</p>

  <div class="gallery">
    <figure><img src="https://picsum.photos/id/1018/400/400" alt="Mountain valley"><figcaption>Valley, early light</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1043/400/400" alt="Desert dunes"><figcaption>Dunes at dusk</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1050/400/400" alt="City street"><figcaption>Old town street</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1060/400/400" alt="Forest canopy"><figcaption>Canopy view</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1069/400/400" alt="Coastline"><figcaption>Rocky coastline</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1074/400/400" alt="Deer in grass"><figcaption>Deer, morning field</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1080/400/400" alt="Lake reflection"><figcaption>Still lake</figcaption></figure>
    <figure><img src="https://picsum.photos/id/1084/400/400" alt="Snowy peak"><figcaption>Snowy peak</figcaption></figure>
    <figure><img src="https://picsum.photos/id/109/400/400" alt="Countryside road"><figcaption>Countryside road</figcaption></figure>
